#--------------------- wild-turns-2-----------------
animations {
  enabled = yes

  # curves
  bezier = snap, 0.1, 1.5, 0.2, 1.0
  bezier = launch, 0.3, 1.7, 0.2, 1.0
  bezier = recoil, 0.6, -0.4, 0.3, 1.2
  bezier = elastic, 0.2, 1.4, 0.3, 1.3
  bezier = smooth, 0.4, 0.0, 0.2, 1.0
  bezier = linear, 1, 1, 1, 1
  bezier = openCurve, 0.2, 1.2, 0.3, 1.0
  bezier = closeCurve, 0.4, 0.0, 0.2, 1.0
  bezier = moveCurve, 0.2, 1.1, 0.3, 1.0

# Windows\
	animation = windows, 1, 2, openCurve, popin 88%
	animation = windowsIn, 1, 2, openCurve, popin 88%
	animation = windowsOut, 1, 2, closeCurve
	animation = windowsMove, 1, 2, moveCurve

  # Borders
  animation = border, 1, 1, smooth
  animation = borderangle, 1, 180, linear, loop

  # Fade — snappier
  animation = fade, 1, 1, smooth

  # Workspaces
  animation = workspaces, 1, 3, elastic, slide
  animation = workspacesIn, 1, 2, launch, slide
  animation = workspacesOut, 1, 2, recoil, slide
}
