[config]
wallpaper_set = true

[templates.waybar]
input_path = "~/.config/matugen/my_templates/colors-waybar.css"
output_path = "~/.config/waybar/wallust/colors-waybar.css"
post_hook = "pkill -SIGUSR2 waybar"

[templates.rofi]
input_path = "~/.config/matugen/my_templates/colors-rofi.rasi"
output_path = "~/.config/rofi/wallust/colors-rofi.rasi"

[templates.hypr]
input_path = "~/.config/matugen/my_templates/colors-hyprland.conf"
output_path = "~/.config/hypr/wallust/wallust-hyprland.conf"



[templates.cava]
input_path = "~/.config/matugen/my_templates/colors-cava"
output_path = "~/.config/cava/config"

[templates.swaync]
input_path = "~/.config/matugen/templates/matugen-swaync.css"
output_path = "~/.config/swaync/wallust/colors-wallust.css"
post_hook = "swaync-client -rs"
